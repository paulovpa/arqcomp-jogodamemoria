<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viagem Computacional</title>

  <!-- Ícones: Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Fontes 16-bit: Press Start 2P, Pixelify Sans e IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela inicial: logo, botão play, nome do jogador -->
  <section id="tela-inicio" class="tela">
    <div class="caixa-inicio">
      <!-- Logo: troque o arquivo em assets/logo/logo.png quando quiser -->
      <div class="logo-moldura">
        <img id="logo" class="logo" src="assets/logo/logo.png" alt="Logo do Viagem Computacional"
             onerror="this.parentElement.classList.add('sem-imagem')">
        <i class="fa-solid fa-plane-departure logo-reserva" aria-hidden="true"></i>
      </div>

      <h1 class="titulo">Viagem Computacional</h1>

      <button id="botao-play" class="botao botao-play" type="button" aria-label="Play">
        <i class="fa-solid fa-play"></i>
      </button>

      <!-- Aparece depois de clicar no play -->
      <form id="form-nome" class="form-nome" hidden novalidate>
        <label for="campo-nome" class="mensagem">Qual é o seu nome, viajante?</label>
        <input id="campo-nome" class="campo-nome" type="text" maxlength="20"
               placeholder="Digite seu nome" autocomplete="off">
        <p id="erro-nome" class="erro-nome mensagem" aria-live="polite"></p>
        <button id="botao-jogar" class="botao" type="submit">Jogar</button>
      </form>
    </div>
  </section>

  <!-- Tela de jogo: pontuação, timer, chances, card questionado e tabuleiro -->
  <section id="tela-jogo" class="tela tela-jogo" hidden>
    <!-- Cabeçalho: pontuação, timer e chances lado a lado, no topo central -->
    <header class="cabecalho-jogo">
      <div class="caixa-info">
        <span class="rotulo-info">Pontos</span>
        <span id="pontuacao" class="pontuacao">0</span>
      </div>
      <div class="caixa-info">
        <span class="rotulo-info"><i class="fa-solid fa-clock"></i> Tempo</span>
        <span id="timer" class="timer">15</span>
      </div>
      <div class="caixa-info">
        <span class="rotulo-info">Chances</span>
        <div id="chances" class="chances" aria-label="Chances restantes"></div>
      </div>
    </header>

    <!-- Desktop: questão à esquerda e tabuleiro à direita. Celular: um abaixo do outro -->
    <div class="area-jogo">
      <div class="painel-questao">
        <!-- Pergunta acima do card da imagem questionada -->
        <div class="area-pergunta">
          <p id="contador-questao" class="contador-questao">Questão 1/16</p>
          <h2 class="pergunta">Qual termo corresponde a esta imagem?</h2>
        </div>

        <!-- Card da imagem questionada (200x200) com descrição e pista -->
        <div class="area-imagem">
          <div id="moldura-questao" class="card-questao">
            <img id="imagem-questao" class="imagem-questao" src="" alt="">
            <span id="reserva-questao" class="reserva-questao"></span>
          </div>
          <!-- Emoji de acerto: troque o arquivo em assets/emojis/fogo.png quando quiser -->
          <div id="emoji-acerto" class="emoji emoji-acerto" hidden>
            <img src="assets/emojis/fogo.png" alt="Emoji de fogo"
                 onerror="this.parentElement.classList.add('sem-imagem')">
            <i class="fa-solid fa-fire emoji-reserva" aria-hidden="true"></i>
          </div>
          <!-- Emoji de erro/tempo esgotado: troque o arquivo em assets/emojis/chorando.png quando quiser -->
          <div id="emoji-erro" class="emoji emoji-erro" hidden>
            <img src="assets/emojis/chorando.png" alt="Emoji chorando"
                 onerror="this.parentElement.classList.add('sem-imagem')">
            <i class="fa-solid fa-face-sad-tear emoji-reserva" aria-hidden="true"></i>
          </div>
          <!-- Aviso de tempo ou chances esgotados, por cima do card -->
          <p id="aviso-questao" class="aviso-questao mensagem" role="status" hidden></p>
        </div>
        <p id="descricao-questao" class="descricao"></p>
        <p id="pista-questao" class="pista"></p>
      </div>

      <!-- Tabuleiro com os cards dos termos (100x100): 4x4 e 3 colunas no celular -->
      <div id="tabuleiro" class="tabuleiro"></div>
    </div>
  </section>

  <!-- Tela de placar final: mensagem, pontuação, barra de acertos, recorde e ranking -->
  <section id="tela-placar" class="tela" hidden>
    <div class="caixa-placar">
      <!-- Mensagem por desempenho, acima da pontuação final -->
      <h2 id="mensagem-desempenho" class="mensagem-desempenho"></h2>

      <!-- Placar do jogador -->
      <div class="placar-jogador">
        <p class="nome-final"><i class="fa-solid fa-user" aria-hidden="true"></i> <span id="nome-final"></span></p>
        <p class="rotulo-info">Pontuação final</p>
        <p id="pontos-final" class="pontos-final">0</p>
      </div>

      <!-- Contador de acertos: barra de progresso abaixo da pontuação -->
      <div class="barra-acertos">
        <div class="barra-trilho" role="progressbar" aria-valuemin="0" aria-valuemax="16"
             id="barra-trilho" aria-labelledby="texto-acertos">
          <div id="barra-preenchida" class="barra-preenchida"></div>
        </div>
        <p id="texto-acertos" class="texto-acertos">0/16 acertadas</p>
      </div>

      <!-- Recorde (salvo no localStorage), entre o placar e o ranking -->
      <div class="recorde">
        <i class="fa-solid fa-trophy recorde-icone" aria-hidden="true"></i>
        <div class="recorde-texto">
          <span class="rotulo-info">Recorde</span>
          <span id="recorde-valor" class="recorde-valor"></span>
        </div>
        <span id="selo-novo-recorde" class="selo-novo-recorde" hidden>Novo recorde!</span>
      </div>

      <!-- Ranking com as últimas partidas (salvo no localStorage) -->
      <div class="ranking">
        <h3 class="titulo-ranking"><i class="fa-solid fa-ranking-star" aria-hidden="true"></i> Ranking</h3>
        <p class="subtitulo-ranking">Últimas partidas</p>
        <ol id="lista-ranking" class="lista-ranking"></ol>
      </div>

      <!-- Ações do placar -->
      <div class="acoes-placar">
        <button id="botao-conferir" class="botao" type="button">
          <i class="fa-solid fa-list-check" aria-hidden="true"></i> Conferir
        </button>
        <button id="botao-reiniciar" class="botao botao-reiniciar" type="button">
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Reiniciar
        </button>
      </div>
    </div>
  </section>

  <!-- Pop-up de fim de jogo -->
  <div id="popup-fim" class="popup-fundo" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="titulo-fim">
      <i class="fa-solid fa-plane-arrival popup-icone" aria-hidden="true"></i>
      <h2 id="titulo-fim" class="popup-titulo">Relaxa, acabou a turbulência!</h2>
      <button id="botao-ver-placar" class="botao" type="button">Ver placar</button>
    </div>
  </div>

  <!-- Pop-up Conferir: termos certos e errados da partida -->
  <div id="popup-conferir" class="popup-fundo" hidden>
    <div class="popup popup-conferir" role="dialog" aria-modal="true" aria-labelledby="titulo-conferir">
      <h2 id="titulo-conferir" class="popup-titulo">Conferir respostas</h2>
      <p id="resumo-conferir" class="resumo-conferir"></p>
      <ul id="lista-conferir" class="lista-conferir"></ul>
      <button id="botao-fechar-conferir" class="botao" type="button">Fechar</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
