<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viagem Computacional</title>

  <!-- Ícones: Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Fontes 16-bit: Press Start 2P, Pixelify Sans e IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela inicial: logo, botão play, nome do jogador -->
  <section id="tela-inicio" class="tela">
    <div class="caixa-inicio">
      <!-- Logo: troque o arquivo em assets/logo/logo.png quando quiser -->
      <div class="logo-moldura">
        <img id="logo" class="logo" src="assets/logo/logo.png" alt="Logo do Viagem Computacional"
             onerror="this.parentElement.classList.add('sem-imagem')">
        <i class="fa-solid fa-plane-departure logo-reserva" aria-hidden="true"></i>
      </div>

      <h1 class="titulo">Viagem Computacional</h1>

      <button id="botao-play" class="botao botao-play" type="button" aria-label="Play">
        <i class="fa-solid fa-play"></i>
      </button>

      <!-- Aparece depois de clicar no play -->
      <form id="form-nome" class="form-nome" hidden novalidate>
        <label for="campo-nome" class="mensagem">Qual é o seu nome, viajante?</label>
        <input id="campo-nome" class="campo-nome" type="text" maxlength="20"
               placeholder="Digite seu nome" autocomplete="off">
        <p id="erro-nome" class="erro-nome mensagem" aria-live="polite"></p>
        <button id="botao-jogar" class="botao" type="submit">Jogar</button>
      </form>
    </div>
  </section>

  <!-- Tela de jogo: pontuação, timer, chances, card questionado e tabuleiro 4x4 -->
  <section id="tela-jogo" class="tela tela-jogo" hidden>
    <!-- Cabeçalho: pontuação e timer lado a lado, chances abaixo -->
    <header class="cabecalho-jogo">
      <div class="painel-topo">
        <div class="caixa-info">
          <span class="rotulo-info">Pontos</span>
          <span id="pontuacao" class="pontuacao">0</span>
        </div>
        <div class="caixa-info">
          <span class="rotulo-info"><i class="fa-solid fa-clock"></i> Tempo</span>
          <span id="timer" class="timer">15</span>
        </div>
      </div>
      <div id="chances" class="chances" aria-label="Chances restantes"></div>
    </header>
  </section>

  <!-- Tela de placar final: mensagem, pontuação, barra de acertos, recorde e ranking -->
  <section id="tela-placar" class="tela" hidden>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
